<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Media Library</title>
    <link rel="stylesheet" href="stylesr.css">
</head>
<body>
    <div class="container">
        <div class="illustration-container">
            <img src="register.webp" alt=" illustration">
        </div>

        <div class="registration-container">
            <div class="form-wrapper">
                <h1>Fill Out Form To Register!</h1>
                
                <form id="registrationForm">
                    <div class="form-group">
                        <label>Full name:</label>
                        <input type="text" id="fullName" required>
                    </div>

                    <div class="form-group">
                        <label>Username:</label>
                        <input type="text" id="username" required>
                    </div>

                    <div class="form-group">
                        <label>Email:</label>
                        <input type="email" id="email" required>
                    </div>

                    <div class="form-group">
                        <label>Password:</label>
                        <input type="password" id="password" required>
                    </div>

                    <div class="form-group">
                        <label>Confirm Password:</label>
                        <input type="password" id="confirmPassword" required>
                    </div>

                    <button type="submit">Register</button>

                    <div class="login-link">
                        Already have an account? <a href="index.html">Login</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="index.js"></script>  <!-- Add this line to link your frontend JS -->
</body>
</html>
