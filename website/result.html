<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Library</title>
    <link rel="stylesheet" href="stylesresult.css">
</head>
<body>
    <div class="header">
        <h1>Media Library</h1>
        <button class="add-media-btn">Add New Media</button>
    </div>

    <div class="search-bar">
        <div class="category-filters">
            <button class="category-btn">All categories</button>
            <button class="category-btn">Books</button>
            <button class="category-btn">Movies</button>
            <button class="category-btn">Music</button>
        </div>
        <input type="search" class="search-input" placeholder="Search">
    </div>

    <div class="media-list">
        <!--  have to link media -->
    </div>

    <div class="pagination">
        <button>← Previous</button>
        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button>Next →</button>
    </div>
</body>
</html>
